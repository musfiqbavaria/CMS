# Prod routing: static SPA for /, Gunicorn for /api/ + /connector/, Daphne for /ws/.
# NOTE: variable proxy targets + resolver so backend/daphne IP changes are picked
# up without an Nginx restart.

# Customer domains (any Host other than the CMS itself) go to the Django renderer.
map $host $serve_spa {
  default 0;
  localhost 1;
  127.0.0.1 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 20m;

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /connector/ {
    limit_req zone=connector_limit burst=200 nodelay;
    set $backend_upstream_connector backend:8000;
    proxy_pass http://$backend_upstream_connector;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    set $daphne_upstream daphne:8001;
    proxy_pass http://$daphne_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /static/ {
    alias /vol/static/;
    expires 30d;
    add_header Cache-Control "public, immutable, max-age=2592000";
  }

  location /media/ {
    alias /vol/media/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    set $renderer backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    if ($serve_spa = 0) {
      proxy_pass http://$renderer;
    }
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-cache";
  }
}
