# Prod routing: admin SPA for /, Gunicorn for /api/ + /connector/, Daphne for /ws/.
# Customer domains render through Django (location / proxies with SPA fallback).
# NOTE: variable proxy targets + resolver so backend/daphne IP changes are picked
# up without an Nginx restart.
# Preserve the client Host header, including its port, for absolute media URLs.
map $host $serve_spa {
  default 0;
  localhost 1;
  127.0.0.1 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 20m;

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Preview HTML supplies its own nonce-based, opaque-sandbox CSP from Django.
  # These local headers stop inheritance of the admin SPA's incompatible CSP.
  location ^~ /connector/v1/preview/ {
    limit_req zone=connector_limit burst=200 nodelay;
    set $preview_backend backend:8000;
    proxy_pass http://$preview_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location /connector/ {
    limit_req zone=connector_limit burst=200 nodelay;
    set $backend_upstream_connector backend:8000;
    proxy_pass http://$backend_upstream_connector;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    set $daphne_upstream daphne:8001;
    proxy_pass http://$daphne_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /static/ {
    alias /vol/static/;
    expires 30d;
    add_header Cache-Control "public, immutable, max-age=2592000";
  }

  location /media/ {
    alias /vol/media/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable, max-age=2592000";
  }

  location / {
    # Customer domains render via Django (proxy_pass when $serve_spa is 0);
    # the CMS's own host falls through to try_files and serves the SPA.
    set $renderer backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    if ($serve_spa = 0) {
      proxy_pass http://$renderer;
    }
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-cache";

  }

  location = /index.html {
    root /usr/share/nginx/html;
    expires -1;
    add_header Cache-Control "no-cache";
  }
}
