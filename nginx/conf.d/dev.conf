# Dev routing: Vite HMR for /, Gunicorn for /api/ + /connector/, Daphne for /ws/.
# NOTE: proxy targets use variables + resolver (below) so container IP changes
# are picked up without an Nginx restart. Upstream blocks are intentionally absent.

# Host routing for built sites: the admin panel lives on localhost; any other
# Host header is a customer domain and goes to the Django renderer.
map $host $root_target {
  default "backend:8000";
  localhost "frontend:5173";
  127.0.0.1 "frontend:5173";
}

server {
  listen 80;
  server_name _;

  # Docker embedded DNS with short TTL: backend/daphne/frontend IPs change on
  # container recreate, and plain upstream blocks resolve only at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 20m;

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location /connector/ {
    limit_req zone=connector_limit burst=200 nodelay;
    set $backend_upstream_connector backend:8000;
    proxy_pass http://$backend_upstream_connector;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Public + cacheable; backend sets ETag/Cache-Control from Phase 6
    proxy_cache_valid 200 60s;
  }

  location /ws/ {
    set $daphne_upstream daphne:8001;
    proxy_pass http://$daphne_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
  }

  location /static/ {
    set $backend_upstream_static backend:8000;
    proxy_pass http://$backend_upstream_static;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location /media/ {
    set $backend_upstream_media backend:8000;
    proxy_pass http://$backend_upstream_media;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    set $frontend_upstream $root_target;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_cache_bypass $http_upgrade;
  }
}
